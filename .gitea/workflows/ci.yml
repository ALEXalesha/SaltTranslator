# Проверки на домашнем Gitea. Копия .github/workflows/ci.yml, отличие одно: задачи
# идут на раннер ПК (метка windows), а не на windows-latest / ubuntu-latest - такие метки
# есть только у раннера ноутбука, и без него задачи висели в очереди и отменялись.
# Раз папка .gitea/workflows есть, Gitea берёт проверки только отсюда: выпуски и Pages -
# дело GitHub, здесь их нет. Меняя проверки, править оба файла.

# Проверки на каждый пуш.
#
# Моделей на раннере нет и не будет: веса весят 6,6 ГБ и распространяются по
# CC BY-NC 4.0. Поэтому здесь быстрые тесты - ядро перевода со свойствами на
# Hypothesis и приложение без моделей, с недокачанной и с битой моделью.
# Тесты на настоящей NLLB (pytest -m slow) гоняются локально перед выпуском.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python - ядро и приложение
    runs-on: windows
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Python ПК (3.13) в своём окружении, а не setup-python: тот ставит Python
      # установщиком, которому нужны права администратора на реестр, - у раннера их нет.
      - name: Python в отдельном окружении
        run: |
          py -3.13 -m venv .ci-venv
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$((Resolve-Path .ci-venv).Path)\Scripts`n")
      - name: Зависимости
        run: pip install -r requirements-dev.txt
      - name: Тесты и свойства
        run: python -m pytest -q

  electron:
    name: Electron - загрузчик, пути, запуск Python
    runs-on: windows
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Зависимости
        run: npm ci
      - name: Тесты
        run: npm test
